[project]
name = "metapp"
version = "0.1.0"
description = "PyQt instrument-cluster client for KUKSA Databroker (see README.md)"
requires-python = ">=3.10"
dependencies = [
    "PyQt6",
    "kuksa-client",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
metapp = "metapp.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: autoas

services:
  as-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: autoas-dev
    working_dir: /workspace
    volumes:
      - ./src:/workspace
    environment:
      - LD_LIBRARY_PATH=/workspace/build/posix/GCC/prebuilt
    ports:
      - "8800:8800"
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
